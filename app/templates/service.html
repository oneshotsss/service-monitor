<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Service Detail</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1 id="name">Service</h1>
  <div id="status">Status: --</div>
  <div id="last">Last heartbeat: --</div>
  <div id="latency">Latency: --</div>
  <h2>Events</h2>
  <ul id="events"></ul>
  <h2>Heartbeats</h2>
  <table id="hb"><thead><tr><th>Time</th><th>Latency</th></tr></thead><tbody></tbody></table>
<script>
const serviceId = decodeURIComponent(window.location.pathname.split('/')[2]);
document.getElementById('name').textContent = serviceId;
async function load(){
  const s = await fetch(`/services/${serviceId}`).then(r=>r.json());
  document.getElementById('status').textContent = 'Status: '+(s.status||'--');
  document.getElementById('last').textContent = 'Last heartbeat: '+(s.last_heartbeat_at||'--');
  const m = await fetch(`/services/${serviceId}/metrics`).then(r=>r.json());
  document.getElementById('latency').textContent = 'Latency avg: '+(m.avg_ms?Math.round(m.avg_ms)+' ms':'--');
  const ev = await fetch(`/services/${serviceId}/events`).then(r=>r.json());
  const el = document.getElementById('events'); el.innerHTML='';
  for(const e of ev){ const li = document.createElement('li'); li.textContent = `${e.timestamp} ${e.old_status}→${e.new_status} ${e.note||''}`; el.appendChild(li); }
  const hb = await fetch(`/services/${serviceId}/heartbeats`).then(r=>r.json());
  const tbody = document.querySelector('#hb tbody'); tbody.innerHTML='';
  for(const h of hb){ const tr = document.createElement('tr'); tr.innerHTML = `<td>${h.timestamp}</td><td>${h.latency_ms} ms</td>`; tbody.appendChild(tr); }
}
load();
setInterval(load,5000);
</script>
</body>
</html>
